services:
  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      SEED_ENABLED: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
